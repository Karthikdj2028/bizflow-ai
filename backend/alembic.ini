# A generic, single database configuration.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
output_encoding = utf-8
# sqlalchemy.url is dynamically set from app.core.config.get_settings().DATABASE_URL
# in alembic/env.py, or explicitly provided by the test runner.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
