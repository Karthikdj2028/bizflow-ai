[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bizflow-ai-backend"
version = "0.1.0"
description = "Backend API for BizFlow AI — Intelligent Business Financial Management & Decision Support Platform"
readme = "../README.md"
requires-python = ">=3.12"
authors = [
    { name = "BizFlow AI Engineering" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

# Exact pinned dependencies for complete build reproducibility
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "bcrypt==4.2.1",
    "pyjwt==2.10.1",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "postgres: opt-in tests requiring live PostgreSQL instance and TEST_DATABASE_URL",
]
